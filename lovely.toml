[[patches]]
[patches.pattern]
match_indent = true
pattern = '''function basestate.load(name)'''
payload = '''
do
	local temp = basestate.fromPath
	basestate.fromPath = function(...)
		log:setEnvironment("BBP_silent")
		temp(...)
		log:setEnvironment()
	end
end
'''
position = "before"
target = "lib/basestate.lua"
times = 1

[[patches]]
[patches.pattern]
match_indent = true
pattern = '''log('loaded event "'..info.name..'" ('..info.event..eType..')')'''
payload = '''-- log('loaded event "'..info.name..'" ('..info.event..eType..')')'''
position = "at"
target = "obj/GameManager.lua"
times = 1

# Loading custom events ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = '''findFiles('levelformat/events')'''
payload = '''log:setEnvironment("BBP_silent")'''
position = "after"
target = "obj/GameManager.lua"
times = 1

[[patches]]
[patches.pattern]
match_indent = true
pattern = '''for i,v in ipairs(eList) do'''
payload = '''log:setEnvironment()'''
position = "before"
target = "obj/GameManager.lua"
times = 1

