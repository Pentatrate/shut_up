[manifest]
dump_lua = true
priority = 1
version = "1.0.0"

# Environments ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = '''return log'''
payload = '''
log._print = -1

log.display.pq = 0
log.display.steam = 0
'''
position = "before"
target = "lib/logging.lua"
times = 1

# Startup ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = '''print('*'''
payload = '''-- removed print'''
position = "at"
target = "conf.lua"
times = 4

[[patches]]
[patches.pattern]
match_indent = true
pattern = '''print('*'''
payload = '''-- removed print'''
position = "at"
target = "main.lua"
times = 5

[[patches]]
[patches.pattern]
match_indent = true
pattern = '''print(love.filesystem.unmountFullPath(sourceBase))'''
payload = '''-- print(love.filesystem.unmountFullPath(sourceBase))'''
position = "at"
target = "main.lua"
times = 1

[[patches]]
[patches.pattern]
match_indent = true
